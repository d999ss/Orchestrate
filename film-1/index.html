<style>
  :root {
    --bg: #04090b;
    --fg: #cdebe7;
    --fg-dim: #7aa9a4;
    --accent: #4ed9c6;
    --line: #14302e;
    --card: #060f11;
    --display: 'Bebas Neue', 'Helvetica Neue', system-ui, sans-serif;
    --body: 'Inter', ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); -webkit-font-smoothing: antialiased; }
  .board-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:18px 48px;border-bottom:1px solid var(--line);background:rgba(4,9,11,0.9);backdrop-filter:blur(6px);position:sticky;top:0;z-index:50;}
  .board-nav .board-tab-logo{justify-self:start;color:#fff;text-decoration:none;grid-column:1;}
  .board-nav-links{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;grid-column:2;}
  .board-nav .board-tab{font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--fg-dim);text-decoration:none;background:transparent;border:none;cursor:pointer;padding:6px 0;font-family:inherit;}
  .board-nav .board-tab:hover{color:var(--accent);}
  .board-nav .board-tab.active{color:var(--accent);}
  .board-nav-sep{width:1px;height:18px;background:var(--line);display:inline-block;margin:0 2px;align-self:center;}

  header { padding: 96px 48px 48px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; flex-wrap: wrap; }
  header .eyebrow { font-family: var(--body); font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  header h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(40px, 5vw, 72px); letter-spacing: 0.01em; line-height: 1.02; color: var(--fg); max-width: 18ch; }
  header .meta { color: var(--fg-dim); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; margin-top: 24px; }
  header .meta span + span::before { content: "·"; margin: 0 10px; color: var(--line); }
  .badge { display:inline-block; padding:4px 10px; border:1px solid var(--accent); color:var(--accent); border-radius:999px; font-size:10px; letter-spacing:0.18em; text-transform:uppercase; margin-left:10px; }

  main { padding: 48px 48px 96px; max-width: 1600px; margin: 0 auto; min-height: calc(100vh - 220px); display: flex; align-items: center; justify-content: center; }
  .player-wrap { width: 100%; background:#000; border:1px solid var(--line); border-radius:6px; overflow:hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.6); }
  video { display:block; width:100%; height:auto; background:#000; }
  .player-meta { margin-top:24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px; padding:24px; border:1px solid var(--line); background:var(--card); border-radius:6px; }
  .player-meta dt { font-size:10px; letter-spacing:0.22em; text-transform:uppercase; color:var(--fg-dim); margin-bottom:6px; }
  .player-meta dd { margin:0; font-family:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size:14px; color:var(--fg); }
  .download-row { margin-top:24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
  .download-row .file-name { font-family:'Geist Mono', ui-monospace, monospace; font-size:12px; color:var(--fg-dim); }
  .dl-btn { display:inline-flex; align-items:center; gap:10px; padding:10px 18px; border:1px solid var(--line); border-radius:999px; color:var(--fg); text-decoration:none; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; transition:160ms; }
  .dl-btn:hover{ border-color:var(--accent); color:var(--accent); }
</style>
</head>
