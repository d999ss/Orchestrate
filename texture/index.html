<style>
  /* matches the Orchestrate review site design system */
  :root{
    --bg:#04090b; --fg:#cdebe7; --fgdim:#7aa9a4; --accent:#4ed9c6;
    --line:#14302e; --card:#060f11;
    --display:'Bebas Neue','Helvetica Neue',system-ui,sans-serif;
    --body:'Inter',ui-sans-serif,-apple-system,'Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#02100f;font-family:var(--body);color:var(--fg);overflow:hidden}
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:#02100f}
  #tex{display:block;width:100vw;height:100vh;object-fit:cover}
  /* control panel */
  #panel{position:fixed;top:16px;right:16px;width:min(288px,calc(100vw - 24px));max-height:calc(100dvh - 32px);overflow:auto;
    background:rgba(6,15,17,.9);backdrop-filter:blur(8px);border:1px solid var(--line);
    border-radius:6px;padding:20px 18px;z-index:10;box-shadow:0 30px 80px -30px rgba(0,0,0,.85)}
  #panelHead{display:flex;justify-content:space-between;align-items:flex-start}
  #closePanel{flex:none;width:26px;height:26px;border-radius:999px;border:1px solid var(--line);background:transparent;
    color:var(--fgdim);cursor:pointer;font-size:14px;line-height:1;margin-top:2px}
  #closePanel:hover{color:var(--accent);border-color:var(--accent)}
  #panel.hidden{transform:translateX(340px);opacity:0;pointer-events:none;transition:.3s}
  #panel h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;letter-spacing:.02em;color:var(--fg)}
  #panel .sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-top:4px;margin-bottom:18px}
  .row{margin:12px 0}
  .row label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fgdim);font-weight:500;margin-bottom:7px}
  .row label .v{color:var(--accent);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;height:2px;-webkit-appearance:none;background:var(--line);border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:54px;font-size:11px;padding:7px 6px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--fgdim);cursor:pointer;letter-spacing:.06em;text-transform:uppercase;font-weight:500;transition:120ms;
    white-space:nowrap;line-height:1.2}
  /* source picker: 2x2 grid so labels never clip on narrow screens */
  #src{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #src button{min-width:0;white-space:normal}
  .seg button:hover{color:var(--accent);border-color:var(--accent)}
  .seg button.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
  .colorrow{display:flex;gap:10px}
  .colorrow .c{flex:1}
  .colorrow input[type=color]{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer;padding:2px}
  .btns{display:flex;gap:8px;margin-top:16px}
  .btns button{flex:1;font-size:12px;padding:10px 6px;border-radius:999px;cursor:pointer;letter-spacing:.08em;text-transform:uppercase;font-weight:500;transition:120ms;height:36px}
  .btns .rand{background:transparent;color:var(--fgdim);border:1px solid var(--line)}
  .btns .rand:hover{color:var(--accent);border-color:var(--accent)}
  .btns .exp{background:var(--accent);color:var(--bg);border:1px solid var(--accent);font-weight:600}
  .exprow{display:flex;gap:8px;align-items:flex-end;margin-top:12px}
  .exprow .c{flex:1}
  .exprow input[type=number]{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:7px;font-size:12px}
  .hint{font-size:10px;color:var(--fgdim);margin-top:4px;letter-spacing:.04em;line-height:1.5}
  #toggle{position:fixed;top:16px;right:16px;z-index:11;display:none;width:38px;height:38px;border-radius:999px;
    background:rgba(6,15,17,.9);border:1px solid var(--line);color:var(--accent);cursor:pointer;font-size:16px}
  #panel.hidden ~ #toggle{display:block}
  .toplabel{position:fixed;bottom:14px;left:16px;z-index:10;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--fgdim);opacity:.6}
</style>

<body>
<div id="stage"><canvas id="tex"></canvas></div>
<button id="toggle">≡</button>

<div id="panel">
  <div id="panelHead">
    <div>
      <h1>Texture Engine</h1>
      <div class="sub">GE Vernova · Orchestrate</div>
    </div>
    <button id="closePanel" aria-label="Hide controls" title="Hide controls">×</button>
  </div>

  <div class="row">
    <label>Source</label>
    <div class="seg" id="src">
      <button data-v="ref" class="on">Reference</button>
      <button data-v="mapclouds">Map + Clouds</button>
      <button data-v="clouds">Clouds</button>
      <button data-v="map">Map</button>
      <button data-v="image">Image…</button>
    </div>
    <input type="file" id="imgfile" accept="image/*" style="display:none">
  </div>

  <div class="row"><label>Grid pitch <span class="v" id="vPitch"></span></label><input type="range" id="pitch" min="3" max="16" step="1"></div>
  <div class="row"><label>Pixel size <span class="v" id="vDot"></span></label><input type="range" id="dot" min="0.25" max="1" step="0.01"></div>
  <div class="row"><label>Density <span class="v" id="vDens"></span></label><input type="range" id="dens" min="-0.30" max="0.55" step="0.01"></div>
  <div class="row"><label>Contrast <span class="v" id="vContrast"></span></label><input type="range" id="contrast" min="0.6" max="2.6" step="0.02"></div>
  <div class="row"><label>Cloud scale <span class="v" id="vScale"></span></label><input type="range" id="scale" min="1" max="9" step="0.1"></div>
  <div class="row"><label>Softness (blur) <span class="v" id="vBlur"></span></label><input type="range" id="blur" min="0" max="3" step="0.1"></div>
  <div class="row"><label>Levels <span class="v" id="vLevels"></span></label><input type="range" id="levels" min="0" max="8" step="1"></div>
  <div class="row"><label>Light sweep <span class="v" id="vSweep"></span></label><input type="range" id="sweep" min="0" max="1" step="0.02"></div>
  <div class="row"><label>Vignette <span class="v" id="vVig"></span></label><input type="range" id="vig" min="0" max="1" step="0.02"></div>

  <div class="row">
    <label>Colors · base / pixel</label>
    <div class="colorrow">
      <div class="c"><input type="color" id="base" value="#0c3a37"></div>
      <div class="c"><input type="color" id="dotcol" value="#74e6cf"></div>
    </div>
  </div>

  <div class="row">
    <label>Animate <span class="v" id="vSpeed"></span></label>
    <div class="seg"><button id="animBtn" data-on="0">Off</button></div>
    <input type="range" id="speed" min="0" max="1" step="0.02" style="margin-top:8px">
  </div>

  <div class="btns">
    <button class="rand" id="randBtn">Randomize</button>
    <button class="exp" id="expBtn">Export PNG</button>
  </div>
  <div class="exprow">
    <div class="c"><label style="font-size:10px;color:#9fc4c4;display:block;margin-bottom:4px">W</label><input type="number" id="exW" value="2000"></div>
    <div class="c"><label style="font-size:10px;color:#9fc4c4;display:block;margin-bottom:4px">H</label><input type="number" id="exH" value="663"></div>
  </div>
  <div class="hint">Default 2000×663 is the reference frame, exported 1:1.</div>
</div>

<div class="toplabel">drag a value · randomize · export</div>

<script>
const TAU=Math.PI*2;
const cv=document.getElementById('tex'), ctx=cv.getContext('2d');
const off=document.createElement('canvas'), octx=off.getContext('2d'); // crisp pixels rendered here, then blurred onto main

/* ---------- value-noise fbm ---------- */
function hash2(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>13))*1274126177|0;return ((h^(h>>16))>>>0)/4294967295;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){let s=0,amp=0.5,f=1;for(let i=0;i<4;i++){s+=amp*vnoise(x*f,y*f);f*=2;amp*=0.5;}return s;}

/* ---------- world map (ellipse continents) ---------- */
const LAND=[[0.18,0.30,0.085,0.11],[0.135,0.21,0.05,0.06],[0.24,0.30,0.05,0.08],[0.305,0.155,0.035,0.05],
  [0.275,0.66,0.045,0.16],[0.235,0.52,0.035,0.06],[0.49,0.26,0.045,0.06],[0.535,0.55,0.075,0.17],
  [0.50,0.43,0.045,0.07],[0.70,0.30,0.155,0.115],[0.645,0.45,0.035,0.06],[0.775,0.55,0.05,0.045],
  [0.82,0.59,0.03,0.03],[0.86,0.72,0.06,0.045]];
function landStrength(nx,ny){let m=0;for(let i=0;i<LAND.length;i++){const e=LAND[i];
  const dx=(nx-e[0])/e[2],dy=(ny-e[1])/e[3];const d=dx*dx+dy*dy;if(d<1.2)m=Math.max(m,1-d*0.84);}return Math.max(0,m);}

/* ---------- image source (cover-mapped so it holds aspect at any window) ---------- */
let imgSampler=null, refSampler=null;
function makeSampler(image){
  const SW=Math.min(400,image.width||400), SH=Math.max(1,Math.round(SW*(image.height||1)/(image.width||1)));
  const c=document.createElement('canvas');c.width=SW;c.height=SH;const cc=c.getContext('2d');
  cc.drawImage(image,0,0,SW,SH);const d=cc.getImageData(0,0,SW,SH).data;
  const As=(image.width||SW)/(image.height||SH);
  return (nx,ny)=>{
    const A=(W||1)/(H||1); let u=nx,v=ny;
    if(A>As) v=(ny-0.5)*(As/A)+0.5; else u=(nx-0.5)*(A/As)+0.5;
    u=u<0?0:u>1?1:u; v=v<0?0:v>1?1:v;
    const x=Math.min(SW-1,u*SW|0), y=Math.min(SH-1,v*SH|0), i=(y*SW+x)*4;
    return (0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255;};
}

/* ---------- state ---------- */
const P={src:'mapclouds',pitch:6,dot:0.58,dens:0.13,contrast:1.05,scale:3.2,blur:0.7,levels:0,
  sweep:0,vig:0.42,base:'#0c3a37',dotcol:'#74e6cf',anim:false,speed:0.3,seed:0};
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

/* brightness field for a normalized coord */
function field(nx,ny,t){
  const sd=P.seed*0.137;
  if((P.src==='ref'||P.src==='image')&&imgSampler){
    return imgSampler(nx,ny);    // straight luminance of the source → 1:1 with it
  }
  const cl=fbm(nx*P.scale+sd+t,ny*P.scale*0.5+sd*1.7);    // organic clouds
  const fine=fbm(nx*P.scale*3.1+sd*2.3,ny*P.scale*3.1);   // fine coastline dither
  if(P.src==='clouds') return Math.pow(cl,1.4)*1.3;
  const land=landStrength(nx,ny);
  if(P.src==='map') return land*(0.55+0.7*cl)*(0.7+0.5*fine);
  // map + clouds (default — matches reference): continents broken into pixel clouds,
  // plus a faint allover field so the grid reads everywhere (not isolated blobs).
  return land*(0.5+0.8*cl)*(0.7+0.5*fine) + cl*0.12*(0.6+0.6*fine) + 0.03;
}

/* ---------- render the crisp pixel grid into octx ---------- */
function renderGrid(g,W,H,t){
  const base=hex(P.base), dotc=hex(P.dotcol);
  // gradient base + diagonal light sweep
  const lg=g.createLinearGradient(0,H,W,0);
  lg.addColorStop(0,'rgb('+(base[0]*0.7|0)+','+(base[1]*0.7|0)+','+(base[2]*0.7|0)+')');
  lg.addColorStop(0.5,'rgb('+base[0]+','+base[1]+','+base[2]+')');
  lg.addColorStop(1,'rgb('+(base[0]*0.78|0)+','+(base[1]*0.78|0)+','+(base[2]*0.78|0)+')');
  g.fillStyle=lg; g.fillRect(0,0,W,H);
  if(P.sweep>0){const sw=g.createLinearGradient(0,H,W*0.9,0);
    sw.addColorStop(0,'rgba(0,0,0,0)');
    sw.addColorStop(0.5,'rgba('+Math.min(255,base[0]+60)+','+Math.min(255,base[1]+70)+','+Math.min(255,base[2]+60)+','+(0.22*P.sweep)+')');
    sw.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=sw;g.fillRect(0,0,W,H);}
  const pp=Math.max(3,Math.round(P.pitch)), sz=Math.max(1,pp*P.dot);
  for(let x=pp/2;x<W;x+=pp){const nx=x/W;
    for(let y=pp/2;y<H;y+=pp){const ny=y/H;
      let b=field(nx,ny,t);
      b=(b-(0.18-P.dens))*P.contrast;
      b=b<0?0:b>1?1:b;
      if(P.levels>0) b=Math.round(b*P.levels)/P.levels;
      // faint uniform grid everywhere + brighter clusters on top (matches reference)
      const bd=b<0.05?0.05:b;                       // floor so every cell shows a faint dot
      const a=Math.min(0.96,0.11+b*0.82);
      const r=(dotc[0]-base[0])*bd+base[0], gg=(dotc[1]-base[1])*bd+base[1], bb=(dotc[2]-base[2])*bd+base[2];
      g.fillStyle='rgba('+(r|0)+','+(gg|0)+','+(bb|0)+','+a.toFixed(3)+')';
      g.fillRect(x-sz/2,y-sz/2,sz,sz);}}
  // vignette
  if(P.vig>0){const v=g.createRadialGradient(W*0.5,H*0.45,Math.min(W,H)*0.15,W*0.5,H*0.5,Math.max(W,H)*0.7);
    v.addColorStop(0,'rgba(0,0,0,0)');
    v.addColorStop(1,'rgba('+(base[0]*0.35|0)+','+(base[1]*0.35|0)+','+(base[2]*0.35|0)+','+P.vig+')');
    g.fillStyle=v;g.fillRect(0,0,W,H);}
}

/* compose to a target ctx at WxH (renders crisp pixels offscreen, then blurs) */
function compose(targetCtx,W,H,t,blurScale){
  off.width=W; off.height=H;
  octx.clearRect(0,0,W,H);
  renderGrid(octx,W,H,t);
  targetCtx.clearRect(0,0,W,H);
  targetCtx.filter = P.blur>0 ? 'blur('+(P.blur*(blurScale||1)).toFixed(2)+'px)' : 'none';
  targetCtx.drawImage(off,0,0);
  targetCtx.filter='none';
}

/* ---------- live canvas ---------- */
let W=0,H=0;
function size(){W=Math.floor(window.innerWidth); H=Math.floor(window.innerHeight);
  cv.width=W; cv.height=H; cv.style.width=W+'px'; cv.style.height=H+'px'; draw();}
function draw(t){compose(ctx,W,H,(P.anim? (t||performance.now())*0.0001*P.speed*10:0),1);}
function loop(t){ if(P.anim){draw(t);} requestAnimationFrame(loop); }

/* ---------- UI wiring ---------- */
function bind(id,key,fmt){const el=document.getElementById(id),out=document.getElementById('v'+id.charAt(0).toUpperCase()+id.slice(1));
  el.value=P[key];
  const show=()=>{ if(out) out.textContent=(fmt?fmt(P[key]):P[key]); };
  el.addEventListener('input',()=>{P[key]=parseFloat(el.value);show();draw();});show();}
bind('pitch','pitch'); bind('dot','dot',v=>v.toFixed(2)); bind('dens','dens',v=>v.toFixed(2));
bind('contrast','contrast',v=>v.toFixed(2)); bind('scale','scale',v=>v.toFixed(1));
bind('blur','blur',v=>v.toFixed(1)); bind('levels','levels',v=>v==0?'smooth':v);
bind('sweep','sweep',v=>v.toFixed(2)); bind('vig','vig',v=>v.toFixed(2)); bind('speed','speed',v=>v.toFixed(2));
document.getElementById('base').addEventListener('input',e=>{P.base=e.target.value;draw();});
document.getElementById('dotcol').addEventListener('input',e=>{P.dotcol=e.target.value;draw();});

function selSrc(v){document.querySelectorAll('#src button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));}
document.querySelectorAll('#src button').forEach(b=>b.addEventListener('click',()=>{
  const v=b.dataset.v;
  if(v==='image'){document.getElementById('imgfile').click();return;}
  if(v==='ref'){imgSampler=refSampler;}
  P.src=v; selSrc(v); draw();}));
document.getElementById('imgfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{imgSampler=makeSampler(img);P.src='image';selSrc('image');draw();};img.src=URL.createObjectURL(f);});

const animBtn=document.getElementById('animBtn');
animBtn.addEventListener('click',()=>{P.anim=!P.anim;animBtn.textContent=P.anim?'On':'Off';animBtn.classList.toggle('on',P.anim);});

document.getElementById('randBtn').addEventListener('click',()=>{
  P.seed=Math.floor(Math.random()*9999);
  P.scale=1.5+Math.random()*5; document.getElementById('scale').value=P.scale; document.getElementById('vScale').textContent=P.scale.toFixed(1);
  P.dens=-0.1+Math.random()*0.4; document.getElementById('dens').value=P.dens; document.getElementById('vDens').textContent=P.dens.toFixed(2);
  draw();});

document.getElementById('expBtn').addEventListener('click',()=>{
  const ew=Math.max(64,parseInt(document.getElementById('exW').value)||2250);
  const eh=Math.max(64,parseInt(document.getElementById('exH').value)||750);
  const oc=document.createElement('canvas'); oc.width=ew; oc.height=eh; const octx2=oc.getContext('2d');
  compose(octx2,ew,eh,(P.anim?performance.now()*0.0001*P.speed*10:0), ew/W);
  oc.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='orchestrate-texture-'+ew+'x'+eh+'.png';a.click();},'image/png');});

document.getElementById('toggle').addEventListener('click',()=>document.getElementById('panel').classList.remove('hidden'));
document.getElementById('closePanel').addEventListener('click',()=>document.getElementById('panel').classList.add('hidden'));

window.addEventListener('resize',size);
size(); requestAnimationFrame(loop);
</script>
